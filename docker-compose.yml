version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: verimeasure-postgres
    restart: always
    environment:
      POSTGRES_DB: verimeasure
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  server:
    build:
      context: ./server
    container_name: verimeasure-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: ${PORT:-5000}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-verimeasure}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
    depends_on:
      - postgres

  client:
    build:
      context: ./client
    container_name: verimeasure-client
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  pgdata:
